<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMFISH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#19383b;color:#f7f5d9;font-family:"Times New Roman","Noto Serif JP",serif}button{font:inherit;cursor:pointer}.screen{width:min(100%,1188px);height:100svh;padding:6vh 8%;margin:auto;display:flex;flex-direction:column;gap:18px}.header{height:100px;flex:0 0 100px;border:3px solid #fff500;display:grid;grid-template-columns:1fr 1fr}.header-info{padding:16px 20px;border-right:2px solid #fff500;color:#fff500;display:flex;flex-direction:column;justify-content:center}.header-title{font-size:clamp(22px,3vw,38px)}.header-sub{font-size:clamp(11px,1.3vw,17px);margin-top:6px}.book-button{border:0;background:#fff500;color:#19383b;font-size:clamp(40px,5vw,68px)}.pond-wrap{position:relative;flex:1;min-height:0}.pond{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2%;padding:1% 1%;overflow:hidden}.spot{position:relative;width:min(88%,260px);aspect-ratio:1;margin:auto;justify-self:center;align-self:center;border:3px solid #fff500;border-radius:50%;background:rgba(16,42,45,.2);box-shadow:0 0 0 2px rgba(255,245,0,.35),0 0 0 7px rgba(255,245,0,.12),inset 0 0 25px rgba(255,245,0,.03);display:grid;place-items:center;overflow:visible;transition:none!important}.spot:before{content:"";position:absolute;inset:9px;border:2px solid #fff500;border-radius:50%;opacity:.9}.spot:after{content:"";position:absolute;inset:-7px;border:1px solid #fff500;border-radius:50%;opacity:.5}.shadow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#626b6c;box-shadow:0 0 0 1px #566061;animation:b 2.1s ease-in-out infinite;touch-action:manipulation;z-index:2;transition:none!important}.medium{width:52px;height:52px}.large{width:78px;height:78px}.gold{width:78px;height:78px;background:#d9b83f;box-shadow:0 0 10px #fff500,0 0 0 1px #fff500}.shadow:after{content:"";position:absolute;inset:-9px;border:1px solid #596365;border-radius:50%}@keyframes b{50%{transform:translate(-50%,-50%) scale(1.1)}}.catch{position:absolute;inset:3px;background:rgba(25,56,59,.96);border:2px solid #fff500;z-index:5;display:grid;grid-template-rows:auto auto auto auto auto;place-content:center;gap:12px;padding:30px;text-align:center;color:#fff500;font-size:clamp(20px,4vw,42px)}.catch-label{font-size:clamp(14px,2.5vw,24px);letter-spacing:.14em}.catch-label.new-species{color:#fff500}.catch-label.analysis-complete{color:#72d9ff}.catch-label.new-record{color:#c084ff}.catch-label.fry{color:#ff8fc7}.catch-success{font-size:clamp(18px,3vw,30px);letter-spacing:.08em}.catch-fish-name{font-size:clamp(22px,4vw,38px);letter-spacing:.06em;color:#fff500;display:flex;flex-direction:column;gap:5px}.catch-fish-name.common{color:#fff500}.catch-fish-name.rare{color:#fff500}.catch-fish-name.mythical{color:#fff500}.catch-rarity{font-size:clamp(18px,3vw,27px);line-height:1.2;letter-spacing:.12em}.catch-rarity.common{color:#ff4b4b}.catch-rarity.rare{color:#72d9ff}.catch-rarity.mythical{color:#c084ff}.catch-size{font-size:clamp(14px,2.5vw,24px);color:#f7f5d9;letter-spacing:.08em}.catch-recover{min-width:180px;padding:14px 32px;border:2px solid #fff500;background:#fff500;color:#19383b;font:inherit;cursor:pointer;letter-spacing:.08em}.hidden{display:none!important}.gauge{height:64px;flex:0 0 64px;border:3px solid #fff500;position:relative;touch-action:none}.target{position:absolute;left:40%;width:20%;top:-3px;bottom:-3px;background:#fff500}.target:after{content:"TAP";position:absolute;inset:0;display:grid;place-items:center;color:#19383b;font:11px Arial;letter-spacing:2px}.cursor{position:absolute;top:50%;left:0;width:4px;height:calc(100% + 16px);background:#f7f5d9;transform:translate(-50%,-50%);z-index:2;pointer-events:none}.status{height:78px;flex:0 0 78px;border:3px solid #fff500;display:grid;place-items:center;text-align:center;padding:10px;font-size:clamp(11px,1.4vw,17px)}.success{color:#fff500}.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,56,59,.98);padding:5vh 8%;overflow:auto}.panel{width:min(100%,850px);margin:auto;border:3px solid #fff500}.ph{min-height:70px;border-bottom:2px solid #fff500;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.ph h2{margin:0;color:#fff500;font-weight:normal}.close{border:0;background:transparent;color:#fff500;font-size:38px}.list{padding:20px}.rarity{margin-bottom:28px}.rt{color:#fff500;border-bottom:1px solid #fff500;padding-bottom:8px;font-size:14px;font-weight:normal}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{min-height:110px;border:1px solid #fff500;padding:10px;background:#102a2d;color:#f7f5d9;text-align:left}.locked{opacity:.35}.no{color:#fff500;font:10px Arial}.name{margin-top:14px;font-size:17px}.detail{padding:20px}.dr{margin-top:0;color:#fff500;font:11px Arial}.dn{font-size:clamp(28px,4vw,44px);font-weight:normal}.line{border-top:1px solid #fff500}.desc{line-height:2}.detail-size{margin:8px 0 12px;color:#fff500;font-size:11px;line-height:1.6;letter-spacing:.06em;display:flex;flex-direction:column;gap:3px}.size-record.fry{color:#ff8fc7}.size-record.giant{color:#c084ff}.size-records{font-size:8px;line-height:1.4;letter-spacing:.03em}.reset-area{margin-top:30px;padding-top:20px;border-top:1px solid #fff500}.reset-btn{width:100%;border:1px solid #fff500;background:transparent;color:#fff500;padding:14px}.confirm{padding:25px}.confirm p{line-height:2}.danger{border:2px solid #fff500;background:#fff500;color:#19383b;padding:14px 28px}.cancel{border:1px solid #fff500;background:transparent;color:#fff500;padding:14px 28px}@media(max-width:700px){.screen{padding:20px 16px 12px;gap:9px}.header{height:66px;flex-basis:66px;border-width:2px}.header-info{padding:7px 9px;border-right:1px solid #fff500}.header-title{font-size:16px}.header-sub{font-size:7px}.book-button{font-size:30px}.pond{gap:0;padding:0}.spot{width:min(94%,175px);border-width:2px}.spot:before{inset:6px;border-width:1px}.spot:after{inset:-5px}.gauge{height:54px;flex-basis:54px;border-width:2px}.status{height:62px;flex-basis:62px;font-size:10px}.medium{width:52px;height:52px}.large,.gold{width:72px;height:72px}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:88px}.name{font-size:14px}.catch{padding:20px;gap:10px}.catch-recover{min-width:140px;padding:12px 24px}.catch-rarity{font-size:18px}.detail-size{font-size:10px}.size-records{font-size:8px}}#book .image,#detail .image{display:none!important}</style></head><body><div class="screen"><header class="header"><div class="header-info"><div class="header-title">外部撮影機鏡頭</div><div class="header-sub">已進行調整以消除無線電波造成の遅延</div></div><button class="book-button" id="openBook">図鑑</button></header><div class="pond-wrap"><main class="pond" id="pond"></main><div class="catch hidden" id="catch"></div></div><div class="gauge" id="gauge"><div class="target"></div><div class="cursor" id="cursor"></div></div><div class="status" id="status">魚影をタップして釣りを開始</div></div><div class="overlay hidden" id="book"><section class="panel"><header class="ph"><h2>魚図鑑</h2><button class="close" id="closeBook">×</button></header><div class="list" id="list"></div></section></div><div class="overlay hidden" id="detail"><section class="panel"><header class="ph"><h2 id="dno"></h2><button class="close" id="closeDetail">×</button></header><div class="detail"><div class="dr" id="dr"></div><h2 class="dn" id="dn"></h2><div class="line"></div><p class="desc" id="dd"></p></div></section></div><div class="overlay hidden" id="resetConfirm"><section class="panel"><header class="ph"><h2>緊急脱出</h2><button class="close" id="closeReset">×</button></header><div class="confirm"><p>サンプルを全て破棄し、速やかに星系を離脱します。<br>本当によろしいですか？</p><button class="danger" id="escape">脱出</button><button class="cancel" id="cancelEscape">キャンセル</button></div></section></div><script src="fish-data.js"></script><script>const pond=document.getElementById('pond');pond.innerHTML='<div class="spot"></div>'.repeat(6);const spots=[...pond.children],status=document.getElementById('status'),cursor=document.getElementById('cursor'),gauge=document.getElementById('gauge'),catchBox=document.getElementById('catch'),book=document.getElementById('book'),detail=document.getElementById('detail'),resetConfirm=document.getElementById('resetConfirm');let active=false,pos=0,raf=0,gaugeStart=0,currentSize='medium';const saveKey='cosmofish-catches';let counts={};try{counts=JSON.parse(localStorage.getItem(saveKey)||'{}')}catch(e){}function createShadow(s){if(s.querySelector('.shadow'))return;const el=document.createElement('div'),r=Math.random();el.className='shadow '+(r<.01?'gold':r<.09?'large':'medium');s.appendChild(el)}function makeSpots(){spots.forEach(createShadow)}function needFor(r){return r==='ふつう'?3:r==='めずらしい'?2:1}function rarityClass(r){return r==='めずらしい'?'rare':r==='まぼろし'?'mythical':'common'}function render(){const list=document.getElementById('list');list.replaceChildren();['ふつう','めずらしい','まぼろし'].forEach(r=>{const group=fishData.filter(f=>f.rarity===r);if(!group.length)return;const sec=document.createElement('section');sec.className='rarity';const need=needFor(r),unlocked=group.filter(f=>(counts[f.id]||0)>=need).length;const title=document.createElement('h3');title.className='rt';title.textContent=r+'　'+unlocked+' / '+group.length;sec.appendChild(title);const grid=document.createElement('div');grid.className='grid';group.forEach(f=>{const b=document.createElement('button'),count=counts[f.id]||0;b.className='card '+(count?'':'locked');b.innerHTML='<div class="no">No.'+String(f.id).padStart(2,'0')+'</div><div class="name">'+(count?f.name:'？？？？？？')+'</div><div class="no" style="margin-top:8px">'+count+'匹</div>';if(count)b.onclick=()=>showDetail(f,count,need);grid.appendChild(b)});sec.appendChild(grid);list.appendChild(sec)});const area=document.createElement('div');area.className='reset-area';area.innerHTML='<button class="reset-btn" id="resetButton">緊急脱出</button>';list.appendChild(area);document.getElementById('resetButton').onclick=()=>resetConfirm.classList.remove('hidden')}function showDetail(f,count,need){document.getElementById('dno').textContent='No.'+String(f.id).padStart(2,'0');document.getElementById('dr').textContent=f.rarity;document.getElementById('dn').textContent=f.name;document.getElementById('dd').textContent=count>=need?f.desc:'あと'+(need-count)+'回捕まえると説明が読めます。';detail.classList.remove('hidden')}document.getElementById('openBook').onclick=()=>{render();book.classList.remove('hidden')};document.getElementById('closeBook').onclick=()=>book.classList.add('hidden');document.getElementById('closeDetail').onclick=()=>detail.classList.add('hidden');document.getElementById('closeReset').onclick=()=>resetConfirm.classList.add('hidden');document.getElementById('cancelEscape').onclick=()=>resetConfirm.classList.add('hidden');document.getElementById('escape').onclick=()=>{localStorage.removeItem(saveKey);counts={};resetConfirm.classList.add('hidden');book.classList.add('hidden');detail.classList.add('hidden');spots.forEach(s=>s.innerHTML='');makeSpots();status.textContent='魚影をタップして釣りを開始'};makeSpots();</script><script src="gauge.js"></script><script src="book-tabs.js"></script><script src="boot.js?v=4"></script></body></html>
