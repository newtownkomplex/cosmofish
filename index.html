<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMFISH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#19383b;color:#f7f5d9;font-family:"Times New Roman","Noto Serif JP",serif}button{font:inherit;cursor:pointer}.screen{width:min(100%,1188px);height:100svh;padding:6vh 8%;margin:auto;display:flex;flex-direction:column;gap:18px}.header{height:100px;flex:0 0 100px;border:3px solid #fff500;display:grid;grid-template-columns:1fr 1fr}.header-info{padding:16px 20px;border-right:2px solid #fff500;color:#fff500;display:flex;flex-direction:column;justify-content:center}.header-title{font-size:clamp(22px,3vw,38px)}.header-sub{font-size:clamp(11px,1.3vw,17px);margin-top:6px}.book-button{border:0;background:#fff500;color:#19383b;font-size:clamp(40px,5vw,68px)}.pond-wrap{position:relative;flex:1;min-height:0}.pond{width:100%;height:100%;border:3px solid #fff500;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));overflow:hidden}.cell{position:relative;min-width:0;min-height:0;border-right:1px solid #fff500;border-bottom:1px solid #fff500;overflow:hidden}.cell:nth-child(3n){border-right:0}.cell:nth-child(n+7){border-bottom:0}.shadow{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%);border-radius:50%;background:#626b6c;box-shadow:0 0 0 1px #566061;animation:b 2.1s ease-in-out infinite;touch-action:manipulation}.shadow:after{content:"";position:absolute;inset:-9px;border:1px solid #596365;border-radius:50%}.small{--w:34px;--h:17px}.medium{--w:52px;--h:26px}.large{--w:78px;--h:39px}@keyframes b{50%{transform:translate(-50%,-50%) scale(1.1)}}.catch{position:absolute;inset:3px;background:rgba(25,56,59,.86);border:2px solid #fff500;z-index:5;display:grid;place-items:center;text-align:center;color:#fff500;font-size:clamp(24px,5vw,54px)}.catch .common{color:#fff500}.catch .rare{color:#72d9ff}.catch .mythical{color:#c084ff}.hidden{display:none!important}.gauge{height:64px;flex:0 0 64px;border:3px solid #fff500;position:relative}.target{position:absolute;left:40%;width:20%;top:-3px;bottom:-3px;background:#fff500}.target:after{content:"TAP";position:absolute;inset:0;display:grid;place-items:center;color:#19383b;font:11px Arial;letter-spacing:2px}.cursor{position:absolute;top:50%;left:0;width:4px;height:calc(100% + 16px);background:#f7f5d9;transform:translate(-50%,-50%);z-index:2}.status{height:78px;flex:0 0 78px;border:3px solid #fff500;display:grid;place-items:center;text-align:center;padding:10px;font-size:clamp(11px,1.4vw,17px)}.success{color:#fff500}.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,56,59,.98);padding:5vh 8%;overflow:auto}.panel{width:min(100%,850px);margin:auto;border:3px solid #fff500}.ph{min-height:70px;border-bottom:2px solid #fff500;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.ph h2{margin:0;color:#fff500;font-weight:normal}.close{border:0;background:transparent;color:#fff500;font-size:38px}.list{padding:20px}.rarity{margin-bottom:28px}.rt{color:#fff500;border-bottom:1px solid #fff500;padding-bottom:8px;font-size:14px;font-weight:normal}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{min-height:110px;border:1px solid #fff500;padding:10px;background:#102a2d;color:#f7f5d9;text-align:left}.locked{opacity:.35}.no{color:#fff500;font:10px Arial}.name{margin-top:14px;font-size:17px}.detail{padding:20px}.image{height:min(45vh,380px);border:2px solid #fff500;background:#102a2d;display:grid;place-items:center;color:#697578;font:12px Arial;letter-spacing:3px}.dr{margin-top:16px;color:#fff500;font:11px Arial}.dn{font-size:clamp(28px,4vw,44px);font-weight:normal}.line{border-top:1px solid #fff500}.desc{line-height:2}@media(max-width:700px){.screen{padding:20px 16px 12px;gap:9px}.header{height:66px;flex-basis:66px;border-width:2px}.header-info{padding:7px 9px;border-right:1px solid #fff500}.header-title{font-size:16px}.header-sub{font-size:7px;margin-top:3px}.book-button{font-size:30px}.pond{border-width:2px}.gauge{height:54px;flex-basis:54px;border-width:2px}.status{height:62px;flex-basis:62px;border-width:2px;font-size:10px}.small{--w:27px;--h:14px}.medium{--w:40px;--h:20px}.large{--w:61px;--h:31px}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:88px}.name{font-size:14px}}</style></head><body><div class="screen"><header class="header"><div class="header-info"><div class="header-title">外部撮影機鏡頭</div><div class="header-sub">已進行調整以消除無線電波造成的延遲</div></div><button class="book-button" id="openBook">図鑑</button></header><div class="pond-wrap"><main class="pond" id="pond"></main><div class="catch hidden" id="catch"></div></div><div class="gauge" id="gauge"><div class="target"></div><div class="cursor" id="cursor"></div></div><div class="status" id="status">魚影をタップして釣りを開始</div></div><div class="overlay hidden" id="book"><section class="panel"><header class="ph"><h2>魚図鑑</h2><button class="close" id="closeBook">×</button></header><div class="list" id="list"></div></section></div><div class="overlay hidden" id="detail"><section class="panel"><header class="ph"><h2 id="dno"></h2><button class="close" id="closeDetail">×</button></header><div class="detail"><div class="image">FISH IMAGE</div><div class="dr" id="dr"></div><h2 class="dn" id="dn"></h2><div class="line"></div><p class="desc" id="dd"></p></div></section></div><script src="fish.js"></script><script>const pond=document.getElementById('pond');pond.innerHTML='<div class="cell"></div>'.repeat(9);const cells=[...pond.children],status=document.getElementById('status'),cursor=document.getElementById('cursor'),gauge=document.getElementById('gauge'),catchBox=document.getElementById('catch'),book=document.getElementById('book'),detail=document.getElementById('detail');let active=false,pos=0,start=0,raf;const saveKey='cosmofish-catches';let counts={};try{counts=JSON.parse(localStorage.getItem(saveKey)||'{}')}catch(e){counts={}};function shadows(){cells.forEach(c=>c.replaceChildren());const n=2+Math.floor(Math.random()*3);[...cells].sort(()=>Math.random()-.5).slice(0,n).forEach(c=>{const s=document.createElement('div'),r=Math.random();s.className='shadow '+(r<.2?'large':r<.5?'medium':'small');s.style.left=35+Math.random()*30+'%';s.style.top=35+Math.random()*30+'%';s.onclick=()=>fishStart(s);c.appendChild(s)})}function fishStart(s){if(active)return;active=true;s.style.display='none';status.textContent='中央の黄色い範囲でTAP!';start=performance.now();function move(t){if(!active)return;const e=(t-start)%1000;pos=e<500?e/5:100-(e-500)/5;cursor.style.left=pos+'%';raf=requestAnimationFrame(move)}raf=requestAnimationFrame(move)}function rarityClass(r){return r==='めずらしい'?'rare':r==='まぼろし'?'mythical':'common'}function needFor(r){return r==='ふつう'?3:r==='めずらしい'?2:1}gauge.addEventListener('pointerdown',()=>{if(!active)return;active=false;cancelAnimationFrame(raf);if(pos>=40&&pos<=60){const f=fishData[Math.floor(Math.random()*fishData.length)];counts[f.id]=(counts[f.id]||0)+1;localStorage.setItem(saveKey,JSON.stringify(counts));catchBox.innerHTML='釣り成功！　<span class="'+rarityClass(f.rarity)+'">'+f.name+'</span>';catchBox.classList.remove('hidden');status.classList.add('success');status.textContent='捕獲しました（'+counts[f.id]+'回目）';setTimeout(()=>{catchBox.classList.add('hidden');status.classList.remove('success');status.textContent='魚影をタップして釣りを開始';shadows()},1200)}else{status.textContent='逃げられた……';setTimeout(()=>{status.textContent='魚影をタップして釣りを開始';shadows()},900)}});function render(){const list=document.getElementById('list');list.replaceChildren();['ふつう','めずらしい','まぼろし'].forEach(r=>{const group=fishData.filter(f=>f.rarity===r);if(!group.length)return;const sec=document.createElement('section');sec.className='rarity';const need=needFor(r),unlocked=group.filter(f=>(counts[f.id]||0)>=need).length;const title=document.createElement('h3');title.className='rt';title.textContent=r+'　'+unlocked+' / '+group.length;sec.appendChild(title);const grid=document.createElement('div');grid.className='grid';group.forEach(f=>{const b=document.createElement('button'),count=counts[f.id]||0;b.className='card '+(count?'':'locked');b.innerHTML='<div class="no">No.'+String(f.id).padStart(2,'0')+'</div><div class="name">'+(count?f.name:'？？？？？？')+'</div><div class="no" style="margin-top:8px">'+count+' / '+need+'</div>';if(count)b.onclick=()=>showDetail(f,count,need);grid.appendChild(b)});sec.appendChild(grid);list.appendChild(sec)})}function showDetail(f,count,need){document.getElementById('dno').textContent='No.'+String(f.id).padStart(2,'0');document.getElementById('dr').textContent=f.rarity;document.getElementById('dn').textContent=f.name;document.getElementById('dd').textContent=count>=need?f.desc:'あと'+(need-count)+'回捕まえると説明が読めます。';detail.classList.remove('hidden')}document.getElementById('openBook').onclick=()=>{render();book.classList.remove('hidden')};document.getElementById('closeBook').onclick=()=>book.classList.add('hidden');document.getElementById('closeDetail').onclick=()=>detail.classList.add('hidden');shadows();</script></body></html>
