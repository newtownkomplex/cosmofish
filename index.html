<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSMFISH // 図鑑</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #19383b;
    --yellow: #fff500;
    --text: #f7f5d9;
    --dark: #102a2d;
    --gray: #697578;
  }

  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Times New Roman", "Noto Serif JP", serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  .screen {
    width: min(100%, 1188px);
    min-height: 100vh;
    padding: 8vh 8%;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ===== HEADER ===== */

  .header {
    height: 110px;
    flex: 0 0 110px;
    border: 3px solid var(--yellow);
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .header-info {
    padding: 18px 22px;
    border-right: 2px solid var(--yellow);
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: var(--yellow);
  }

  .header-title {
    font-size: clamp(22px, 3vw, 38px);
    line-height: 1.05;
  }

  .header-sub {
    margin-top: 7px;
    font-size: clamp(12px, 1.35vw, 18px);
    line-height: 1.2;
  }

  .book-button {
    border: 0;
    background: var(--yellow);
    color: var(--bg);
    font-size: clamp(42px, 5vw, 70px);
    letter-spacing: .08em;
  }

  .book-button:active {
    transform: translateY(1px);
  }

  /* ===== 3 x 3 POND ===== */

  .pond {
    flex: 1;
    min-height: 0;
    border: 3px solid var(--yellow);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
  }

  .cell {
    position: relative;
    min-height: 145px;
    border-right: 1px solid var(--yellow);
    border-bottom: 1px solid var(--yellow);
    overflow: hidden;
  }

  .cell:nth-child(3n) {
    border-right: 0;
  }

  .cell:nth-child(n+7) {
    border-bottom: 0;
  }

  .shadow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--shadow-width);
    height: var(--shadow-height);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #626b6c;
    box-shadow: 0 0 0 1px #566061;
    animation: breathe 2.1s ease-in-out infinite;
    touch-action: manipulation;
  }

  .shadow::after {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid #596365;
    border-radius: 50%;
  }

  .shadow:active {
    transform: translate(-50%, -50%) scale(.9);
  }

  .shadow.small {
    --shadow-width: 34px;
    --shadow-height: 17px;
  }

  .shadow.medium {
    --shadow-width: 52px;
    --shadow-height: 26px;
  }

  .shadow.large {
    --shadow-width: 78px;
    --shadow-height: 39px;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.1); }
  }

  /* ===== GAUGE ===== */

  .gauge-wrap {
    height: 82px;
    flex: 0 0 82px;
    position: relative;
    border: 3px solid var(--yellow);
    display: flex;
    align-items: center;
    padding: 0 4px;
  }

  .gauge {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .target {
    position: absolute;
    left: 40%;
    width: 20%;
    top: -3px;
    bottom: -3px;
    background: var(--yellow);
  }

  .target::after {
    content: "TAP";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--bg);
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
  }

  .cursor {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 4px;
    height: calc(100% + 18px);
    transform: translate(-50%, -50%);
    background: var(--text);
    box-shadow: 0 0 0 1px var(--bg);
    pointer-events: none;
  }

  /* ===== STATUS ===== */

  .status {
    height: 115px;
    flex: 0 0 115px;
    border: 3px solid var(--yellow);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
    font-size: clamp(13px, 1.5vw, 20px);
    letter-spacing: .08em;
  }

  .status.success {
    color: var(--yellow);
  }

  /* ===== OVERLAYS ===== */

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(25, 56, 59, .98);
    padding: 5vh 8%;
    overflow-y: auto;
  }

  .panel {
    width: min(100%, 850px);
    margin: 0 auto;
    border: 3px solid var(--yellow);
    background: var(--bg);
  }

  .panel-header {
    min-height: 80px;
    border-bottom: 2px solid var(--yellow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
  }

  .panel-header h2 {
    margin: 0;
    color: var(--yellow);
    font-size: clamp(24px, 4vw, 42px);
    font-weight: normal;
  }

  .close {
    border: 0;
    background: transparent;
    color: var(--yellow);
    font-size: 38px;
    line-height: 1;
  }

  .book-list {
    padding: 22px;
  }

  .rarity {
    margin-bottom: 28px;
  }

  .rarity-title {
    margin: 0 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--yellow);
    color: var(--yellow);
    font-size: 14px;
    font-weight: normal;
  }

  .fish-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }

  .fish-card {
    min-height: 120px;
    border: 1px solid var(--yellow);
    padding: 12px;
    background: var(--dark);
    color: var(--text);
    text-align: left;
  }

  .fish-card.locked {
    opacity: .35;
    cursor: default;
  }

  .fish-no {
    color: var(--yellow);
    font-family: Arial, sans-serif;
    font-size: 10px;
  }

  .fish-name {
    margin-top: 18px;
    font-size: 18px;
  }

  /* ===== FISH DETAIL ===== */

  .detail {
    padding: 22px;
  }

  .fish-image {
    height: min(45vh, 400px);
    border: 2px solid var(--yellow);
    background: var(--dark);
    display: grid;
    place-items: center;
    color: var(--gray);
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
  }

  .detail-rarity {
    margin-top: 18px;
    color: var(--yellow);
    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
  }

  .detail-name {
    margin: 8px 0 14px;
    font-size: clamp(28px, 4vw, 44px);
    font-weight: normal;
  }

  .detail-line {
    border-top: 1px solid var(--yellow);
  }

  .detail-description {
    margin: 18px 0 0;
    font-size: 16px;
    line-height: 2;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 700px) {
    .screen {
      padding: 22px 18px 16px;
      gap: 10px;
    }

    .header {
      height: 72px;
      flex-basis: 72px;
      border-width: 2px;
    }

    .header-info {
      padding: 8px 10px;
      border-right-width: 1px;
    }

    .header-title {
      font-size: 17px;
    }

    .header-sub {
      font-size: 7px;
      margin-top: 4px;
    }

    .book-button {
      font-size: 31px;
    }

    .pond {
      border-width: 2px;
    }

    .cell {
      min-height: 105px;
    }

    .shadow.small {
      --shadow-width: 27px;
      --shadow-height: 14px;
    }

    .shadow.medium {
      --shadow-width: 40px;
      --shadow-height: 20px;
    }

    .shadow.large {
      --shadow-width: 61px;
      --shadow-height: 31px;
    }

    .gauge-wrap {
      height: 58px;
      flex-basis: 58px;
      border-width: 2px;
    }

    .status {
      height: 76px;
      flex-basis: 76px;
      border-width: 2px;
      font-size: 10px;
    }

    .fish-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .fish-card {
      min-height: 90px;
    }

    .fish-name {
      font-size: 14px;
    }
  }
</style>
</head>

<body>
<div class="screen">

  <header class="header">
    <div class="header-info">
      <div class="header-title">外部撮影機鏡頭</div>
      <div class="header-sub">已進行調整以消除無線電波造成的延遲</div>
    </div>

    <button class="book-button" id="openBook">図鑑</button>
  </header>

  <main class="pond" id="pond">
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
    <div class="cell"></div>
  </main>

  <section class="gauge-wrap" id="gaugeWrap" aria-label="釣りゲージ">
    <div class="gauge" id="gauge">
      <div class="target"></div>
      <div class="cursor" id="cursor"></div>
    </div>
  </section>

  <section class="status" id="status">
    魚影をタップして釣りを開始
  </section>
</div>

<!-- 魚図鑑 -->
<div class="overlay hidden" id="bookOverlay">
  <section class="panel">
    <header class="panel-header">
      <h2>魚図鑑</h2>
      <button class="close" id="closeBook">×</button>
    </header>
    <div class="book-list" id="bookList"></div>
  </section>
</div>

<!-- 魚詳細 -->
<div class="overlay hidden" id="detailOverlay">
  <section class="panel">
    <header class="panel-header">
      <h2 id="detailNo">No.01</h2>
      <button class="close" id="closeDetail">×</button>
    </header>

    <div class="detail">
      <div class="fish-image">FISH IMAGE</div>
      <div class="detail-rarity" id="detailRarity">ふつう</div>
      <h2 class="detail-name" id="detailName">星くずアジ</h2>
      <div class="detail-line"></div>
      <p class="detail-description" id="detailDescription">
        あああああああああああ
      </p>
    </div>
  </section>
</div>

<script>
  const fishData = [
    { id: 1, name: "星くずアジ", rarity: "ふつう", description: "あああああああああああ" },
    { id: 2, name: "銀河メダカ", rarity: "ふつう", description: "あああああああああああ" },
    { id: 3, name: "月面コイ", rarity: "ふつう", description: "あああああああああああ" },
    { id: 4, name: "ネビュラナマズ", rarity: "めずらしい", description: "あああああああああああ" },
    { id: 5, name: "彗星ウナギ", rarity: "まぼろし", description: "あああああああああああ" },
    { id: 6, name: "？？？？？？", rarity: "???", description: "あああああああああああ" }
  ];

  const pond = document.getElementById("pond");
  const cells = [...pond.querySelectorAll(".cell")];
  const gaugeWrap = document.getElementById("gaugeWrap");
  const gauge = document.getElementById("gauge");
  const cursor = document.getElementById("cursor");
  const status = document.getElementById("status");

  const openBook = document.getElementById("openBook");
  const closeBook = document.getElementById("closeBook");
  const bookOverlay = document.getElementById("bookOverlay");
  const bookList = document.getElementById("bookList");

  const closeDetail = document.getElementById("closeDetail");
  const detailOverlay = document.getElementById("detailOverlay");
  const detailNo = document.getElementById("detailNo");
  const detailRarity = document.getElementById("detailRarity");
  const detailName = document.getElementById("detailName");
  const detailDescription = document.getElementById("detailDescription");

  let active = false;
  let activeShadow = null;
  let position = 0;
  let direction = 1;
  let animationId = null;

  const caughtFish = new Set();

  function resetShadows() {
    cells.forEach(cell => {
      cell.innerHTML = "";
    });

    // 9マスの中から2〜4マスをランダムに選んで魚影を配置。
    // 大: 20% / 中: 30% / 小: 50%
    const count = 2 + Math.floor(Math.random() * 3);
    const shuffledCells = [...cells].sort(() => Math.random() - 0.5);
    const selectedCells = shuffledCells.slice(0, count);

    selectedCells.forEach(cell => {
      const shadow = document.createElement("div");
      shadow.className = "shadow " + getShadowSize();

      // セル内の位置も少しランダムにして、整然としすぎないようにする。
      shadow.style.left = (35 + Math.random() * 30) + "%";
      shadow.style.top = (35 + Math.random() * 30) + "%";

      shadow.onclick = () => startFishing(shadow);
      cell.appendChild(shadow);
    });
  }

  function getShadowSize() {
    const random = Math.random();

    if (random < 0.20) return "large";
    if (random < 0.50) return "medium";
    return "small";
  }

  function startFishing(shadow) {
    if (active) return;

    active = true;
    activeShadow = shadow;
    shadow.style.display = "none";

    status.textContent = "魚がかかった……！";

    setTimeout(() => {
      status.textContent = "中央の黄色い範囲でTAP!";
      startGauge();
    }, 450);
  }

  function startGauge() {
    position = 0;
    direction = 1;
    gaugeWrap.classList.remove("hidden");

    cancelAnimationFrame(animationId);

    function animate() {
      if (!active) return;

      position += 0.8 * direction;

      if (position >= 100) {
        position = 100;
        direction = -1;
      }

      if (position <= 0) {
        position = 0;
        direction = 1;
      }

      cursor.style.left = position + "%";
      animationId = requestAnimationFrame(animate);
    }

    animate();
  }

  gauge.addEventListener("pointerdown", () => {
    if (!active) return;

    const success = position >= 40 && position <= 60;
    finishFishing(success);
  });

  function finishFishing(success) {
    active = false;
    cancelAnimationFrame(animationId);
    gaugeWrap.classList.add("hidden");

    if (!success) {
      status.textContent = "逃げられた……";
      setTimeout(() => {
        status.textContent = "魚影をタップして釣りを開始";
        resetShadows();
      }, 900);
      return;
    }

    const fish = getRandomFish();
    caughtFish.add(fish.id);

    status.classList.add("success");
    status.textContent = "釣り成功！　" + fish.name;

    setTimeout(() => {
      status.classList.remove("success");
      status.textContent = "魚影をタップして釣りを開始";
      resetShadows();
    }, 1200);
  }

  function getRandomFish() {
    const random = Math.random() * 100;
    let rarity;

    if (random < 0.1) rarity = "???";
    else if (random < 1) rarity = "まぼろし";
    else if (random < 5) rarity = "めずらしい";
    else rarity = "ふつう";

    const candidates = fishData.filter(fish => fish.rarity === rarity);
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  openBook.addEventListener("click", () => {
    renderBook();
    bookOverlay.classList.remove("hidden");
  });

  closeBook.addEventListener("click", () => {
    bookOverlay.classList.add("hidden");
  });

  closeDetail.addEventListener("click", () => {
    detailOverlay.classList.add("hidden");
  });

  function renderBook() {
    bookList.innerHTML = "";

    ["ふつう", "めずらしい", "まぼろし", "???"].forEach(rarity => {
      const section = document.createElement("section");
      section.className = "rarity";

      const fishes = fishData.filter(fish => fish.rarity === rarity);
      const caught = fishes.filter(fish => caughtFish.has(fish.id)).length;

      const title = document.createElement("h3");
      title.className = "rarity-title";
      title.textContent = rarity + "　" + caught + " / " + fishes.length;

      const grid = document.createElement("div");
      grid.className = "fish-grid";

      fishes.forEach(fish => {
        const card = document.createElement("button");
        card.className = "fish-card";

        const isCaught = caughtFish.has(fish.id);

        if (!isCaught) {
          card.classList.add("locked");
          card.disabled = true;
        }

        card.innerHTML = `
          <div class="fish-no">No.${String(fish.id).padStart(2, "0")}</div>
          <div class="fish-name">${isCaught ? fish.name : "？？？？？？"}</div>
        `;

        if (isCaught) {
          card.addEventListener("click", () => showFishDetail(fish));
        }

        grid.appendChild(card);
      });

      section.appendChild(title);
      section.appendChild(grid);
      bookList.appendChild(section);
    });
  }

  function showFishDetail(fish) {
    detailNo.textContent = "No." + String(fish.id).padStart(2, "0");
    detailRarity.textContent = fish.rarity;
    detailName.textContent = fish.name;
    detailDescription.textContent = fish.description;

    detailOverlay.classList.remove("hidden");
  }

  resetShadows();
  gaugeWrap.classList.remove("hidden");
</script>
</body>
</html>
