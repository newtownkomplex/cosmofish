<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMFISH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#19383b;color:#f7f5d9;font-family:"Times New Roman","Noto Serif JP",serif}button{font:inherit}.screen{width:min(100%,1188px);height:100svh;padding:6vh 8%;margin:auto;display:flex;flex-direction:column;gap:18px}.header{height:100px;flex:0 0 100px;border:3px solid #fff500;display:grid;grid-template-columns:1fr 1fr}.header-info{padding:16px 20px;border-right:2px solid #fff500;color:#fff500;display:flex;flex-direction:column;justify-content:center}.header-title{font-size:clamp(22px,3vw,38px)}.header-sub{font-size:clamp(11px,1.3vw,17px);margin-top:6px}.book-button{border:0;background:#fff500;color:#19383b;font-size:clamp(40px,5vw,68px)}.pond-wrap{position:relative;flex:1;min-height:0}.pond{width:100%;height:100%;border:3px solid #fff500;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));overflow:hidden}.cell{position:relative;min-width:0;min-height:0;border-right:1px solid #fff500;border-bottom:1px solid #fff500;overflow:hidden}.cell:nth-child(3n){border-right:0}.cell:nth-child(n+7){border-bottom:0}.shadow{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%);border-radius:50%;background:#626b6c;box-shadow:0 0 0 1px #566061;animation:b 2.1s ease-in-out infinite;touch-action:manipulation}.shadow:after{content:"";position:absolute;inset:-9px;border:1px solid #596365;border-radius:50%}.small{--w:34px;--h:17px}.medium{--w:52px;--h:26px}.large{--w:78px;--h:39px}@keyframes b{50%{transform:translate(-50%,-50%) scale(1.1)}}.catch{position:absolute;inset:3px;background:rgba(25,56,59,.86);border:2px solid #fff500;z-index:5;display:grid;place-items:center;text-align:center;color:#fff500;font-size:clamp(24px,5vw,54px)}.hidden{display:none!important}.gauge{height:64px;flex:0 0 64px;border:3px solid #fff500;position:relative}.target{position:absolute;left:40%;width:20%;top:-3px;bottom:-3px;background:#fff500}.target:after{content:"TAP";position:absolute;inset:0;display:grid;place-items:center;color:#19383b;font:11px Arial;letter-spacing:2px}.cursor{position:absolute;top:50%;left:0;width:4px;height:calc(100% + 16px);background:#f7f5d9;transform:translate(-50%,-50%);z-index:2}.status{height:78px;flex:0 0 78px;border:3px solid #fff500;display:grid;place-items:center;text-align:center;padding:10px;font-size:clamp(11px,1.4vw,17px)}.success{color:#fff500}.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,56,59,.98);padding:5vh 8%;overflow:auto}.panel{width:min(100%,850px);margin:auto;border:3px solid #fff500}.ph{min-height:70px;border-bottom:2px solid #fff500;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.ph h2{margin:0;color:#fff500;font-weight:normal}.close{border:0;background:transparent;color:#fff500;font-size:38px}.list{padding:20px}.rarity{margin-bottom:28px}.rt{color:#fff500;border-bottom:1px solid #fff500;padding-bottom:8px;font-size:14px;font-weight:normal}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{min-height:110px;border:1px solid #fff500;padding:10px;background:#102a2d;color:#f7f5d9;text-align:left}.locked{opacity:.35}.no{color:#fff500;font:10px Arial}.name{margin-top:14px;font-size:17px}.detail{padding:20px}.image{height:min(45vh,380px);border:2px solid #fff500;background:#102a2d;display:grid;place-items:center;color:#697578;font:12px Arial;letter-spacing:3px}.dr{margin-top:16px;color:#fff500;font:11px Arial}.dn{font-size:clamp(28px,4vw,44px);font-weight:normal}.line{border-top:1px solid #fff500}.desc{line-height:2}@media(max-width:700px){.screen{padding:20px 16px 12px;gap:9px}.header{height:66px;flex-basis:66px;border-width:2px}.header-info{padding:7px 9px;border-right:1px solid #fff500}.header-title{font-size:16px}.header-sub{font-size:7px;margin-top:3px}.book-button{font-size:30px}.pond{border-width:2px}.gauge{height:54px;flex-basis:54px;border-width:2px}.status{height:62px;flex-basis:62px;border-width:2px;font-size:10px}.small{--w:27px;--h:14px}.medium{--w:40px;--h:20px}.large{--w:61px;--h:31px}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:88px}.name{font-size:14px}}</style></head><body><div class="screen"><header class="header"><div class="header-info"><div class="header-title">外部撮影機鏡頭</div><div class="header-sub">已進行調整以消除無線電波造成的延遲</div></div><button class="book-button" id="openBook">図鑑</button></header><div class="pond-wrap"><main class="pond" id="pond"></main><div class="catch hidden" id="catch"></div></div><div class="gauge" id="gauge"><div class="target"></div><div class="cursor" id="cursor"></div></div><div class="status" id="status">魚影をタップして釣りを開始</div></div><div class="overlay hidden" id="book"><section class="panel"><header class="ph"><h2>魚図鑑</h2><button class="close" id="closeBook">×</button></header><div class="list" id="list"></div></section></div><div class="overlay hidden" id="detail"><section class="panel"><header class="ph"><h2 id="dno"></h2><button class="close" id="closeDetail">×</button></header><div class="detail"><div class="image">FISH IMAGE</div><div class="dr" id="dr"></div><h2 class="dn" id="dn"></h2><div class="line"></div><p class="desc" id="dd"></p></div></section></div><script>
const descriptions=[['星屑あじ','星屑のような光をまとい、群れで銀河を泳ぐ小型魚。'],['月面鯉','月の砂地を這うように泳ぐ、重力に逆らう鯉。'],['銀河メダカ','体の中に小さな銀河が浮かんで見える、とても小さな魚。'],['星雲アユ','星雲の流れに逆らって泳ぐ、光るヒレを持つアユ。'],['月影フナ','月明かりのない場所ほど活発になる、影のようなフナ。'],['彗星イワナ','彗星の尾を追いかけて泳ぐ、非常に素早いイワナ。'],['星砂ハゼ','砂の代わりに星砂を集めて巣を作る小さなハゼ。'],['宙空ナマズ','宇宙空間を漂いながら、ヒゲで周囲の魚を探すナマズ。'],['流星カジカ','流星が通過すると一斉に飛び跳ねる習性を持つ。'],['星屑メバル','星屑のような斑点が夜になると淡く輝くメバル。'],['月光サンマ','月光をまとって細長い軌跡を残すサンマ。'],['宇宙タナゴ','小惑星の隙間に卵を産みつける、不思議なタナゴ。'],['星霜ワカサギ','長い年月を生きる珍しいワカサギ。体に年輪のような模様がある。'],['銀河ウナギ','銀河の渦に沿って体をくねらせながら泳ぐ細長い魚。'],['月虹コイ','月の光を浴びると、体に七色の虹が浮かび上がる。'],['星海キンギョ','星の海をひらひら泳ぐ、金色の尾を持つキンギョ。'],['彗星カマス','彗星のような速度で突進する、気性の荒い魚。'],['宙色アジ','見る角度によって体色が青、紫、黒へと変化するアジ。'],['星灯りイサキ','暗闇で体の縞模様が淡く発光する夜行性の魚。'],['月面ボラ','月のクレーターに溜まった水たまりを好んで泳ぐボラ。'],['星屑カワムツ','群れで泳ぐたび、細かな光の粒を撒き散らす。'],['銀河ヤマメ','銀河の流れを遡上するように泳ぐ、銀色のヤマメ。'],['星雲シシャモ','星雲のガスを吸い込んで、腹部を青白く光らせる。'],['月影ハヤ','月の影に沿って泳ぐため、捕まえるのが難しい魚。'],['流星ニゴイ','流星が落ちる場所に集まる、少し鈍そうで実は素早い魚。'],['星海カレイ','星の海底に身を隠し、体の模様まで星空そっくりに変化する。'],['宙釣りサバ','何もない宇宙空間に浮かび、尾びれだけで方向を変える。'],['月虹オイカワ','月虹が出た夜だけ、体が鮮やかな虹色になる。'],['星砂トビウオ','星砂を尾びれにまとい、宇宙を長距離滑空する。'],['銀河カジキ','銀河を横断するほどの長い旅をする大型魚。'],['彗星フグ','危険を感じると体を膨らませ、彗星のように飛び去る。'],['星屑チョウチンアンコウ','頭の先に星屑を灯し、暗い宇宙で獲物を誘い寄せる。']];
const rare=[['ネビュラオロチ','体の中に霧状の光が流れる巨大魚。'],['アステルダツ','星明かりを浴びると体が透明になる細長い魚。'],['コメットハゼ','尾を振るたび、小さな光の粒を撒き散らす。'],['ルナギンブナ','月の裏側にだけ生息すると言われる白銀の魚。'],['ノヴァフグ','驚くと一瞬だけ強烈に発光する。'],['オービットカレイ','何かの周囲を一定の軌道で泳ぎ続ける習性がある。'],['アストラメダカ','一匹ずつ違う星模様を持つ極小の魚。'],['クエーサーサバ','遠くからでも分かるほど強い光を放つ大型魚。'],['ゼロイドナマズ','水中なのに重力の影響をほとんど受けない。'],['ミーティアヤマメ','流星が落ちた場所でしか見つからない。'],['ヤミドジョウ','暗闇に溶け込むような黒い体を持ち、光のない場所ではほとんど姿を見つけられない珍しいドジョウ。'],['パルサーイワナ','一定のリズムで体を点滅させる。'],['コズモウナギ','体を丸めると小さな渦が発生する。'],['アポロンキンギョ','遠くの恒星の光を好む金色の魚。'],['エクリプスアンコウ','光を吸収する黒い体と、ひとつだけ光る触手を持つ。']];
const fish=[...descriptions.map((x,i)=>({id:i+1,name:x[0],rarity:'ふつう',desc:x[1]})),...rare.map((x,i)=>({id:i+33,name:x[0],rarity:'めずらしい',desc:x[1]})),{id:48,name:'彗星ウナギ',rarity:'まぼろし',desc:'あああああああああああ'},{id:49,name:'？？？？？？',rarity:'???',desc:'あああああああああああ'}];
const pond=document.getElementById('pond');pond.innerHTML='<div class="cell"></div>'.repeat(9);const cells=[...pond.children];const status=document.getElementById('status'),cursor=document.getElementById('cursor'),gauge=document.getElementById('gauge'),catchBox=document.getElementById('catch'),book=document.getElementById('book'),detail=document.getElementById('detail');let active=false,pos=0,start=0,raf;const saveKey='cosmofish-catches';let counts={};try{counts=JSON.parse(localStorage.getItem(saveKey)||'{}')}catch(e){counts={}};
function shadows(){cells.forEach(c=>c.replaceChildren());const n=2+Math.floor(Math.random()*3);[...cells].sort(()=>Math.random()-.5).slice(0,n).forEach(c=>{const s=document.createElement('div'),r=Math.random();s.className='shadow '+(r<.2?'large':r<.5?'medium':'small');s.style.left=35+Math.random()*30+'%';s.style.top=35+Math.random()*30+'%';s.onclick=()=>fishStart(s);c.appendChild(s)})}
function fishStart(s){if(active)return;active=true;s.style.display='none';status.textContent='中央の黄色い範囲でTAP!';start=performance.now();function move(t){if(!active)return;const e=(t-start)%1000;pos=e<500?e/5:100-(e-500)/5;cursor.style.left=pos+'%';raf=requestAnimationFrame(move)}raf=requestAnimationFrame(move)}
gauge.addEventListener('pointerdown',()=>{if(!active)return;active=false;cancelAnimationFrame(raf);if(pos>=40&&pos<=60){const f=fish[Math.floor(Math.random()*fish.length)];counts[f.id]=(counts[f.id]||0)+1;localStorage.setItem(saveKey,JSON.stringify(counts));catchBox.textContent='釣り成功！　'+f.name;catchBox.classList.remove('hidden');status.classList.add('success');status.textContent='捕獲しました（'+counts[f.id]+'回目）';setTimeout(()=>{catchBox.classList.add('hidden');status.classList.remove('success');status.textContent='魚影をタップして釣りを開始';shadows()},1200)}else{status.textContent='逃げられた……';setTimeout(()=>{status.textContent='魚影をタップして釣りを開始';shadows()},900)}});
function render(){const list=document.getElementById('list');list.replaceChildren();['ふつう','めずらしい','まぼろし','???'].forEach(r=>{const fs=fish.filter(f=>f.rarity===r);if(!fs.length)return;const sec=document.createElement('section');sec.className='rarity';const need=r==='ふつう'?3:r==='めずらしい'?2:3;const unlocked=fs.filter(f=>(counts[f.id]||0)>=need).length;const title=document.createElement('h3');title.className='rt';title.textContent=r+'　'+unlocked+' / '+fs.length;sec.appendChild(title);const grid=document.createElement('div');grid.className='grid';fs.forEach(f=>{const b=document.createElement('button'),count=counts[f.id]||0;b.className='card '+(count?'':'locked');b.innerHTML='<div class="no">No.'+String(f.id).padStart(2,'0')+'</div><div class="name">'+(count?f.name:'？？？？？？')+'</div><div class="no" style="margin-top:8px">'+count+' / '+need+'</div>';if(count)b.onclick=()=>showDetail(f,count,need);grid.appendChild(b)});sec.appendChild(grid);list.appendChild(sec)})}
function showDetail(f,count,need){document.getElementById('dno').textContent='No.'+String(f.id).padStart(2,'0');document.getElementById('dr').textContent=f.rarity;document.getElementById('dn').textContent=f.name;document.getElementById('dd').textContent=count>=need?f.desc:'あと'+(need-count)+'回捕まえると説明が読めます。';detail.classList.remove('hidden')}
document.getElementById('openBook').onclick=()=>{render();book.classList.remove('hidden')};document.getElementById('closeBook').onclick=()=>book.classList.add('hidden');document.getElementById('closeDetail').onclick=()=>detail.classList.add('hidden');shadows();</script></body></html>
