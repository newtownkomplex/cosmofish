<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COSMFISH</title><style>*{box-sizing:border-box}:root{--bg:#19383b;--y:#fff500;--t:#f7f5d9;--d:#102a2d;--g:#697578}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font-family:"Times New Roman","Noto Serif JP",serif}button{font:inherit}.screen{width:min(100%,1188px);min-height:100vh;padding:8vh 8%;margin:auto;display:flex;flex-direction:column;gap:22px}.header{height:110px;border:3px solid var(--y);display:grid;grid-template-columns:1fr 1fr}.header-info{padding:18px 22px;border-right:2px solid var(--y);color:var(--y);display:flex;flex-direction:column;justify-content:center}.header-title{font-size:clamp(22px,3vw,38px)}.header-sub{font-size:clamp(12px,1.35vw,18px);margin-top:7px}.book-button{border:0;background:var(--y);color:var(--bg);font-size:clamp(42px,5vw,70px)}.pond-wrap{position:relative;flex:1;min-height:0}.pond{height:100%;border:3px solid var(--y);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}.cell{position:relative;min-height:145px;border-right:1px solid var(--y);border-bottom:1px solid var(--y)}.cell:nth-child(3n){border-right:0}.cell:nth-child(n+7){border-bottom:0}.shadow{position:absolute;left:50%;top:50%;width:var(--w);height:var(--h);transform:translate(-50%,-50%);border-radius:50%;background:#626b6c;box-shadow:0 0 0 1px #566061;animation:b 2.1s ease-in-out infinite}.shadow:after{content:"";position:absolute;inset:-9px;border:1px solid #596365;border-radius:50%}.small{--w:34px;--h:17px}.medium{--w:52px;--h:26px}.large{--w:78px;--h:39px}@keyframes b{50%{transform:translate(-50%,-50%) scale(1.1)}}.catch{position:absolute;inset:3px;background:rgba(25,56,59,.82);border:2px solid var(--y);z-index:5;display:flex;align-items:center;justify-content:center;color:var(--y);font-size:clamp(24px,5vw,54px)}.gauge{height:82px;border:3px solid var(--y);position:relative;padding:0 4px}.target{position:absolute;left:40%;width:20%;top:-3px;bottom:-3px;background:var(--y)}.target:after{content:"TAP";position:absolute;inset:0;display:grid;place-items:center;color:var(--bg);font:11px Arial;letter-spacing:2px}.cursor{position:absolute;top:50%;left:0;width:4px;height:calc(100% + 18px);background:var(--t);transform:translate(-50%,-50%)}.status{height:115px;border:3px solid var(--y);display:grid;place-items:center;text-align:center}.success{color:var(--y)}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,56,59,.98);padding:5vh 8%;overflow:auto}.panel{width:min(100%,850px);margin:auto;border:3px solid var(--y)}.ph{min-height:80px;border-bottom:2px solid var(--y);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.ph h2{color:var(--y);font-weight:normal}.close{border:0;background:0;color:var(--y);font-size:38px}.list{padding:22px}.rarity{margin-bottom:28px}.rt{color:var(--y);border-bottom:1px solid var(--y);padding-bottom:8px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{min-height:120px;border:1px solid var(--y);padding:12px;background:var(--d);color:var(--t);text-align:left}.locked{opacity:.35}.no{color:var(--y);font:10px Arial}.name{margin-top:18px;font-size:18px}.detail{padding:22px}.image{height:min(45vh,400px);border:2px solid var(--y);background:var(--d);display:grid;place-items:center;color:var(--g);font:12px Arial;letter-spacing:3px}.dr{margin-top:18px;color:var(--y);font:11px Arial}.dn{font-size:clamp(28px,4vw,44px);font-weight:normal}.line{border-top:1px solid var(--y)}.desc{line-height:2}@media(max-width:700px){.screen{padding:22px 18px 16px;gap:10px}.header{height:72px}.header-info{padding:8px 10px}.header-title{font-size:17px}.header-sub{font-size:7px}.book-button{font-size:31px}.cell{min-height:105px}.small{--w:27px;--h:14px}.medium{--w:40px;--h:20px}.large{--w:61px;--h:31px}.gauge{height:58px}.status{height:76px;font-size:10px}.grid{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="screen"><header class="header"><div class="header-info"><div class="header-title">外部撮影機鏡頭</div><div class="header-sub">已進行調整以消除無線電波造成的延遲</div></div><button class="book-button" id="openBook">図鑑</button></header><div class="pond-wrap"><main class="pond" id="pond"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></main><div class="catch hidden" id="catch"></div></div><div class="gauge" id="gauge"><div class="target"></div><div class="cursor" id="cursor"></div></div><div class="status" id="status">魚影をタップして釣りを開始</div></div><div class="overlay hidden" id="book"><section class="panel"><header class="ph"><h2>魚図鑑</h2><button class="close" id="closeBook">×</button></header><div class="list" id="list"></div></section></div><div class="overlay hidden" id="detail"><section class="panel"><header class="ph"><h2 id="dno"></h2><button class="close" id="closeDetail">×</button></header><div class="detail"><div class="image">FISH IMAGE</div><div class="dr" id="dr"></div><h2 class="dn" id="dn"></h2><div class="line"></div><p class="desc" id="dd"></p></div></section></div><script>
const common=[['星屑あじ','星屑のような光をまとい、群れで銀河を泳ぐ小型魚。'],['月面鯉','月の砂地を這うように泳ぐ、重力に逆らう鯉。'],['銀河メダカ','体の中に小さな銀河が浮かんで見える、とても小さな魚。'],['星雲アユ','星雲の流れに逆らって泳ぐ、光るヒレを持つアユ。'],['月影フナ','月明かりのない場所ほど活発になる、影のようなフナ。'],['彗星イワナ','彗星の尾を追いかけて泳ぐ、非常に素早いイワナ。'],['星砂ハゼ','砂の代わりに星砂を集めて巣を作る小さなハゼ。'],['宙空ナマズ','宇宙空間を漂いながら、ヒゲで周囲の魚を探すナマズ。'],['流星カジカ','流星が通過すると一斉に飛び跳ねる習性を持つ。'],['星屑メバル','星屑のような斑点が夜になると淡く輝くメバル。'],['月光サンマ','月光をまとって細長い軌跡を残すサンマ。'],['宇宙タナゴ','小惑星の隙間に卵を産みつける、不思議なタナゴ。'],['星霜ワカサギ','長い年月を生きる珍しいワカサギ。体に年輪のような模様がある。'],['銀河ウナギ','銀河の渦に沿って体をくねらせながら泳ぐ細長い魚。'],['月虹コイ','月の光を浴びると、体に七色の虹が浮かび上がる。'],['星海キンギョ','星の海をひらひら泳ぐ、金色の尾を持つキンギョ。'],['彗星カマス','彗星のような速度で突進する、気性の荒い魚。'],['宙色アジ','見る角度によって体色が青、紫、黒へと変化するアジ。'],['星灯りイサキ','暗闇で体の縞模様が淡く発光する夜行性の魚。'],['月面ボラ','月のクレーターに溜まった水たまりを好んで泳ぐボラ。'],['星屑カワムツ','群れで泳ぐたび、細かな光の粒を撒き散らす。'],['銀河ヤマメ','銀河の流れを遡上するように泳ぐ、銀色のヤマメ。'],['星雲シシャモ','星雲のガスを吸い込んで、腹部を青白く光らせる。'],['月影ハヤ','月の影に沿って泳ぐため、捕まえるのが難しい魚。'],['流星ニゴイ','流星が落ちる場所に集まる、少し鈍そうで実は素早い魚。'],['星海カレイ','星の海底に身を隠し、体の模様まで星空そっくりに変化する。'],['宙釣りサバ','何もない宇宙空間に浮かび、尾びれだけで方向を変える。'],['月虹オイカワ','月虹が出た夜だけ、体が鮮やかな虹色になる。'],['星砂トビウオ','星砂を尾びれにまとい、宇宙を長距離滑空する。'],['銀河カジキ','銀河を横断するほどの長い旅をする大型魚。'],['彗星フグ','危険を感じると体を膨らませ、彗星のように飛び去る。'],['星屑チョウチンアンコウ','頭の先に星屑を灯し、暗い宇宙で獲物を誘い寄せる。']];
const fish=common.map((x,i)=>({id:i+1,name:x[0],rarity:'ふつう',desc:x[1]}));fish.push({id:33,name:'ネビュラナマズ',rarity:'めずらしい',desc:'あああああああああああ'},{id:34,name:'彗星ウナギ',rarity:'まぼろし',desc:'あああああああああああ'},{id:35,name:'？？？？？？',rarity:'???',desc:'あああああああああああ'});
const cells=[...document.querySelectorAll('.cell')],status=document.getElementById('status'),cursor=document.getElementById('cursor'),gauge=document.getElementById('gauge'),catchBox=document.getElementById('catch');let active=false,pos=0,start=0,raf;const saveKey='cosmofish-catches';let counts=JSON.parse(localStorage.getItem(saveKey)||'{}');
function shadows(){cells.forEach(c=>c.innerHTML='');const n=2+Math.floor(Math.random()*3);[...cells].sort(()=>Math.random()-.5).slice(0,n).forEach(c=>{let s=document.createElement('div'),r=Math.random();s.className='shadow '+(r<.2?'large':r<.5?'medium':'small');s.style.left=35+Math.random()*30+'%';s.style.top=35+Math.random()*30+'%';s.onclick=()=>fishStart(s);c.appendChild(s)})}
function fishStart(s){if(active)return;active=true;s.style.display='none';status.textContent='中央の黄色い範囲でTAP!';start=performance.now();function move(t){if(!active)return;let e=(t-start)%1000;pos=e<500?e/5:100-(e-500)/5;cursor.style.left=pos+'%';raf=requestAnimationFrame(move)}raf=requestAnimationFrame(move)}
gauge.onclick=()=>{if(!active)return;active=false;cancelAnimationFrame(raf);if(pos>=40&&pos<=60){let f=fish[Math.floor(Math.random()*fish.length)];counts[f.id]=(counts[f.id]||0)+1;localStorage.setItem(saveKey,JSON.stringify(counts));catchBox.textContent='釣り成功！　'+f.name;catchBox.classList.remove('hidden');status.textContent='捕獲しました（'+counts[f.id]+'回目）';setTimeout(()=>{catchBox.classList.add('hidden');status.textContent='魚影をタップして釣りを開始';shadows()},1200)}else{status.textContent='逃げられた……';setTimeout(()=>{status.textContent='魚影をタップして釣りを開始';shadows()},900)}};
function render(){const list=document.getElementById('list');list.innerHTML='';let sec=document.createElement('section');sec.className='rarity';let commonFish=fish.filter(f=>f.rarity==='ふつう'),unlocked=commonFish.filter(f=>(counts[f.id]||0)>=3).length;sec.innerHTML='<h3 class="rt">ふつう　'+unlocked+' / '+commonFish.length+'</h3>';let grid=document.createElement('div');grid.className='grid';commonFish.forEach(f=>{let b=document.createElement('button');let count=counts[f.id]||0,unlocked=count>=3;b.className='card '+(count?'':'locked');b.innerHTML='<div class="no">No.'+String(f.id).padStart(2,'0')+'</div><div class="name">'+(count?f.name:'？？？？？？')+'</div><div class="no" style="margin-top:8px">'+count+' / 3</div>';if(count)b.onclick=()=>detailShow(f,count);grid.appendChild(b)});sec.appendChild(grid);list.appendChild(sec)}
function detailShow(f,count){dno.textContent='No.'+String(f.id).padStart(2,'0');dr.textContent=f.rarity;dn.textContent=f.name;dd.textContent=count>=3?f.desc:'あと'+(3-count)+'回捕まえると説明が読めます。';detail.classList.remove('hidden')}
openBook.onclick=()=>{render();book.classList.remove('hidden')};closeBook.onclick=()=>book.classList.add('hidden');closeDetail.onclick=()=>detail.classList.add('hidden');shadows();
</script></body></html>
