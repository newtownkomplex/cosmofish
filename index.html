<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COSMFISH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#19383b;color:#f7f5d9;font-family:"Times New Roman","Noto Serif JP",serif}button{font:inherit;cursor:pointer}.screen{width:min(100%,1188px);height:100svh;padding:6vh 8%;margin:auto;display:flex;flex-direction:column;gap:18px;animation:screenReveal 2.8s ease-out both}.header{height:100px;flex:0 0 100px;border:3px solid #fff500;display:grid;grid-template-columns:1fr 1fr;animation:yellowReveal 2.8s ease-out .15s both}.header-info{padding:16px 20px;border-right:2px solid #fff500;color:#fff500;display:flex;flex-direction:column;justify-content:center}.header-title{font-size:clamp(22px,3vw,38px)}.header-sub{font-size:clamp(11px,1.3vw,17px);margin-top:6px}.book-button{border:0;background:#fff500;color:#19383b;font-size:clamp(40px,5vw,68px);animation:yellowFill 2.5s ease-out .3s both}.pond-wrap{position:relative;flex:1;min-height:0}.pond{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:2%;padding:1% 1%;overflow:hidden;animation:yellowReveal 3s ease-out .2s both}.spot{position:relative;width:min(88%,260px);aspect-ratio:1;margin:auto;border:3px solid #fff500;border-radius:50%;background:rgba(16,42,45,.2);box-shadow:0 0 0 2px rgba(255,245,0,.35),0 0 0 7px rgba(255,245,0,.12),inset 0 0 25px rgba(255,245,0,.03);display:grid;place-items:center;overflow:visible}.spot:before{content:"";position:absolute;inset:9px;border:2px solid #fff500;border-radius:50%;opacity:.9}.spot:after{content:"";position:absolute;inset:-7px;border:1px solid #fff500;border-radius:50%;opacity:.5}.shadow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#626b6c;box-shadow:0 0 0 1px #566061;animation:b 2.1s ease-in-out infinite;touch-action:manipulation;z-index:2}.medium{width:52px;height:52px}.large{width:78px;height:78px}.gold{width:78px;height:78px;background:#d9b83f;box-shadow:0 0 10px #fff500,0 0 0 1px #fff500}.shadow:after{content:"";position:absolute;inset:-9px;border:1px solid #596365;border-radius:50%}@keyframes b{50%{transform:translate(-50%,-50%) scale(1.1)}}@keyframes screenReveal{0%{opacity:.08}100%{opacity:1}}@keyframes yellowReveal{0%{opacity:.08;filter:brightness(.3);box-shadow:0 0 0 rgba(255,245,0,0)}45%{opacity:.45;filter:brightness(.55);box-shadow:0 0 20px rgba(255,245,0,.14)}100%{opacity:1;filter:brightness(1);box-shadow:none}}@keyframes yellowFill{0%{opacity:.08;filter:brightness(.25)}55%{opacity:.55;filter:brightness(.65)}100%{opacity:1;filter:brightness(1)}}.catch{position:absolute;inset:3px;background:rgba(25,56,59,.9);border:2px solid #fff500;z-index:5;display:grid;place-items:center;text-align:center;color:#fff500;font-size:clamp(24px,5vw,54px)}.catch .common{color:#fff500}.catch .rare{color:#72d9ff}.catch .mythical{color:#c084ff}.catch .unconfirmed{color:#f7f5d9}.hidden{display:none!important}.gauge{height:64px;flex:0 0 64px;border:3px solid #fff500;position:relative;touch-action:none;animation:yellowReveal 2.4s ease-out .45s both}.target{position:absolute;left:40%;width:20%;top:-3px;bottom:-3px;background:#fff500}.target:after{content:"TAP";position:absolute;inset:0;display:grid;place-items:center;color:#19383b;font:11px Arial;letter-spacing:2px}.cursor{position:absolute;top:50%;left:0;width:4px;height:calc(100% + 16px);background:#f7f5d9;transform:translate(-50%,-50%);z-index:2;pointer-events:none}.status{height:78px;flex:0 0 78px;border:3px solid #fff500;display:grid;place-items:center;text-align:center;padding:10px;font-size:clamp(11px,1.4vw,17px);animation:yellowReveal 2.2s ease-out .6s both}.success{color:#fff500}.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,56,59,.98);padding:5vh 8%;overflow:auto}.panel{width:min(100%,850px);margin:auto;border:3px solid #fff500}.ph{min-height:70px;border-bottom:2px solid #fff500;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.ph h2{margin:0;color:#fff500;font-weight:normal}.close{border:0;background:transparent;color:#fff500;font-size:38px}.list{padding:20px}.rarity{margin-bottom:28px}.rt{color:#fff500;border-bottom:1px solid #fff500;padding-bottom:8px;font-size:14px;font-weight:normal}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{min-height:110px;border:1px solid #fff500;padding:10px;background:#102a2d;color:#f7f5d9;text-align:left}.locked{opacity:.35}.no{color:#fff500;font:10px Arial}.name{margin-top:14px;font-size:17px}.detail{padding:20px}.image{height:min(45vh,380px);border:2px solid #fff500;background:#102a2d;display:grid;place-items:center;color:#697578;font:12px Arial;letter-spacing:3px}.dr{margin-top:16px;color:#fff500;font:11px Arial}.dn{font-size:clamp(28px,4vw,44px);font-weight:normal}.line{border-top:1px solid #fff500}.desc{line-height:2}.reset-area{margin-top:30px;padding-top:20px;border-top:1px solid #fff500}.reset-btn{width:100%;border:1px solid #fff500;background:transparent;color:#fff500;padding:14px}.confirm{padding:25px}.confirm p{line-height:2}.danger{border:2px solid #fff500;background:#fff500;color:#19383b;padding:14px 28px}.cancel{border:1px solid #fff500;background:transparent;color:#fff500;padding:14px 28px}@media(max-width:700px){.screen{padding:20px 16px 12px;gap:9px}.header{height:66px;flex-basis:66px;border-width:2px}.header-info{padding:7px 9px;border-right:1px solid #fff500}.header-title{font-size:16px}.header-sub{font-size:7px}.book-button{font-size:30px}.pond{gap:0;padding:0}.spot{width:min(94%,175px);border-width:2px}.spot:before{inset:6px;border-width:1px}.spot:after{inset:-5px}.gauge{height:54px;flex-basis:54px;border-width:2px}.status{height:62px;flex-basis:62px;border-width:2px;font-size:10px}.medium{width:52px;height:52px}.large,.gold{width:72px;height:72px}.grid{grid-template-columns:repeat(2,1fr)}.card{min-height:88px}.name{font-size:14px}}#bootScreen{position:fixed;inset:0;z-index:9999;background:#19383b;color:#f7f5d9;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;opacity:1;transition:opacity .5s ease}.boot-done{opacity:0}.boot-inner{width:min(76vw,620px);text-align:center}.boot-title{min-height:1.5em;color:#fff500;font-size:clamp(25px,5vw,52px);letter-spacing:.12em}.boot-gauge{height:18px;border:2px solid #fff500;margin-top:42px;background:#102a2d}.boot-fill{width:0;height:100%;background:#fff500}.boot-status{margin-top:15px;color:#f7f5d9;font-family:Arial,sans-serif;font-size:11px;letter-spacing:.08em}</style></head><body><div class="screen"><header class="header"><div class="header-info"><div class="header-title">外部撮影機鏡頭</div><div class="header-sub">已進行調整以消除無線電波造成的遅延</div></div><button class="book-button" id="openBook">図鑑</button></header><div class="pond-wrap"><main class="pond" id="pond"></main><div class="catch hidden" id="catch"></div></div><div class="gauge" id="gauge"><div class="target"></div><div class="cursor" id="cursor"></div></div><div class="status" id="status">魚影をタップして釣りを開始</div></div><div class="overlay hidden" id="book"><section class="panel"><header class="ph"><h2>魚図鑑</h2><button class="close" id="closeBook">×</button></header><div class="list" id="list"></div></section></div><div class="overlay hidden" id="detail"><section class="panel"><header class="ph"><h2 id="dno"></h2><button class="close" id="closeDetail">×</button></header><div class="detail"><div class="image">FISH IMAGE</div><div class="dr" id="dr"></div><h2 class="dn" id="dn"></h2><div class="line"></div><p class="desc" id="dd"></p></div></section></div><div class="overlay hidden" id="resetConfirm"><section class="panel"><header class="ph"><h2>緊急脱出</h2><button class="close" id="closeReset">×</button></header><div class="confirm"><p>サンプルを全て破棄し、速やかに星系を離脱します。<br>本当によろしいですか？</p><button class="danger" id="escape">脱出</button><button class="cancel" id="cancelEscape">キャンセル</button></div></section></div><script src="fish-data.js"></script><script>const pond=document.getElementById('pond');pond.innerHTML='<div class="spot"></div>'.repeat(6);const spots=[...pond.children],status=document.getElementById('status'),cursor=document.getElementById('cursor'),gauge=document.getElementById('gauge'),catchBox=document.getElementById('catch'),book=document.getElementById('book'),detail=document.getElementById('detail'),resetConfirm=document.getElementById('resetConfirm');let active=false,pos=0,raf=0,gaugeStart=0,currentSize='medium';const saveKey='cosmofish-catches';let counts={};try{counts=JSON.parse(localStorage.getItem(saveKey)||'{}')}catch(e){}function shadows(){spots.forEach(s=>s.replaceChildren());const n=4+Math.floor(Math.random()*3);[...spots].sort(()=>Math.random()-.5).slice(0,n).forEach(s=>{const el=document.createElement('div');const r=Math.random();el.className='shadow '+(r<.01?'gold':r<.09?'large':'medium');s.appendChild(el)})}function fishStart(s){if(active)return;active=true;currentSize=s.classList.contains('gold')?'gold':s.classList.contains('large')?'large':'medium';s.style.display='none';pos=0;cursor.style.left='0%';status.textContent='中央の黄色い範囲でTAP!';gaugeStart=performance.now();function move(now){if(!active)return;const elapsed=(now-gaugeStart)%1000;pos=elapsed<500?(elapsed/500)*100:(1-(elapsed-500)/500)*100;cursor.style.left=pos+'%';raf=requestAnimationFrame(move)}raf=requestAnimationFrame(move)}function pickFish(size){const rates=size==='gold'?[['めずらしい',10],['まぼろし',90]]:[['ふつう',91],['めずらしい',9]];let x=Math.random()*100,sum=0;for(const[r,p]of rates){sum+=p;if(x<sum){const a=fishData.filter(f=>f.rarity===r);return a[Math.floor(Math.random()*a.length)]}}}function rarityClass(r){return r==='めずらしい'?'rare':r==='まぼろし'?'mythical':r==='未確認'?'unconfirmed':'common'}function needFor(r){return r==='ふつう'?3:r==='めずらしい'?2:1}gauge.addEventListener('pointerdown',e=>{if(!active)return;e.preventDefault();active=false;cancelAnimationFrame(raf);if(pos>=40&&pos<=60){const f=pickFish(currentSize);counts[f.id]=(counts[f.id]||0)+1;localStorage.setItem(saveKey,JSON.stringify(counts));catchBox.innerHTML='釣り成功！　<span class="'+rarityClass(f.rarity)+'">'+f.name+'</span>';catchBox.classList.remove('hidden');status.classList.add('success');status.textContent='捕獲しました（'+counts[f.id]+'回目）';setTimeout(()=>{catchBox.classList.add('hidden');status.classList.remove('success');status.textContent='魚影をタップして釣りを開始';shadows()},1200)}else{status.textContent='逃げられた……';setTimeout(()=>{status.textContent='魚影をタップして釣りを開始';shadows()},900)}});pond.addEventListener('pointerdown',e=>{const s=e.target.closest('.shadow');if(!s)return;fishStart(s)},{capture:true});function render(){const list=document.getElementById('list');list.replaceChildren();['ふつう','めずらしい','まぼろし','未確認'].forEach(r=>{const group=fishData.filter(f=>f.rarity===r);if(!group.length)return;const sec=document.createElement('section');sec.className='rarity';const need=needFor(r),unlocked=group.filter(f=>(counts[f.id]||0)>=need).length;const title=document.createElement('h3');title.className='rt';title.textContent=r+'　'+unlocked+' / '+group.length;sec.appendChild(title);const grid=document.createElement('div');grid.className='grid';group.forEach(f=>{const b=document.createElement('button'),count=counts[f.id]||0;b.className='card '+(count?'':'locked');b.innerHTML='<div class="no">No.'+String(f.id).padStart(2,'0')+'</div><div class="name">'+(count?f.name:'？？？？？？')+'</div><div class="no" style="margin-top:8px">'+count+' / '+need+'</div>';if(count)b.onclick=()=>showDetail(f,count,need);grid.appendChild(b)});sec.appendChild(grid);list.appendChild(sec)});const area=document.createElement('div');area.className='reset-area';area.innerHTML='<button class="reset-btn" id="resetButton">緊急脱出</button>';list.appendChild(area);document.getElementById('resetButton').onclick=()=>resetConfirm.classList.remove('hidden')}function showDetail(f,count,need){document.getElementById('dno').textContent='No.'+String(f.id).padStart(2,'0');document.getElementById('dr').textContent=f.rarity;document.getElementById('dn').textContent=f.name;document.getElementById('dd').textContent=count>=need?f.desc:'あと'+(need-count)+'回捕まえると説明が読めます。';detail.classList.remove('hidden')}document.getElementById('openBook').onclick=()=>{render();book.classList.remove('hidden')};document.getElementById('closeBook').onclick=()=>book.classList.add('hidden');document.getElementById('closeDetail').onclick=()=>detail.classList.add('hidden');document.getElementById('closeReset').onclick=()=>resetConfirm.classList.add('hidden');document.getElementById('cancelEscape').onclick=()=>resetConfirm.classList.add('hidden');document.getElementById('escape').onclick=()=>{localStorage.removeItem(saveKey);counts={};resetConfirm.classList.add('hidden');book.classList.add('hidden');detail.classList.add('hidden');status.textContent='サンプルを全て破棄しました';shadows()};shadows();</script><script src="gauge.js"></script><script src="audio.js"></script><script src="boot.js"></script></body></html>
